<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Measure mass and volume, calculate density, and identify mystery materials. A free bilingual science investigation for grades 6–8."><title>Density Detective | Sciesmic Labs</title><link rel="icon" href="assets/cube_brass.svg" type="image/svg+xml"><link rel="stylesheet" href="../kit/labs-kit.css"><link rel="stylesheet" href="style.css"></head><body><main>
<header class="hero"><div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="h1"></h1><p class="lede" data-i18n="lede"></p><p class="small" data-i18n="gradeNote"></p><a id="flashcards-link" href="flashcards.html?lang=en" target="_blank" rel="noopener" data-i18n="openCards"></a></div><div class="hero-art" aria-hidden="true"><img src="assets/wood_large.svg" alt=""><span>ρ = m / V</span><img src="assets/acrylic_small.svg" alt=""></div></header>
<section class="panel predict"><div><p class="eyebrow" data-i18n="step1"></p><h2 data-i18n="predictPrompt"></h2><p data-i18n="predictHelp"></p></div><div><label for="prediction" data-i18n="prediction"></label><textarea id="prediction" rows="4"></textarea></div></section>
<section class="panel investigation"><p class="eyebrow" data-i18n="step2"></p><h2 data-i18n="workspace"></h2><div class="modes" role="group" data-i18n-attr="aria-label:workspace"><button data-mode="guided" data-i18n="guided"></button><button data-mode="explore" data-i18n="explore"></button><button data-mode="mystery" data-i18n="mystery"></button></div><p id="mode-hint"></p>
<div class="sample-bar"><div id="material-control"><label for="material" data-i18n="material"></label><select id="material"></select></div><div id="shape-control"><label for="shape" data-i18n="shape"></label><select id="shape"></select></div><div class="sample-card"><img id="sample-art" alt=""><div><strong id="sample-name"></strong><p class="small" id="progress" role="status"></p></div></div><div><button id="reset" data-i18n="reset"></button><button id="new-mystery" hidden data-i18n="newMystery"></button></div></div>
<p id="guided-steps" class="small" data-i18n="helpSteps"></p>
<div class="stations">
<article class="station"><h3 data-i18n="massStation"></h3><div class="stage" id="mass-scene"></div><p data-i18n-rich="massHelp"></p><button id="weigh" class="action"><img src="assets/btn_weigh.svg" alt=""><span data-i18n="weigh"></span></button><div class="reading"><span data-i18n="massLabel"></span><output id="mass-reading">—</output></div></article>
<article class="station"><h3 data-i18n="volumeStation"></h3><div class="stage" id="volume-scene"></div><p data-i18n-rich="volumeHelp"></p><button id="measure" class="action"><img src="assets/btn_volume.svg" alt=""><span data-i18n="measure"></span></button><div class="reading"><span data-i18n="volumeLabel"></span><output id="volume-reading">—</output></div><p id="volume-note" class="small"></p><p id="float-guard" class="note" hidden data-i18n="floatGuard"></p></article>
<article class="station"><h3 data-i18n="floatStation"></h3><div class="stage" id="water-scene"></div><p data-i18n-rich="floatHelp"></p><button id="drop" class="action"><img src="assets/btn_drop.svg" alt=""><span data-i18n="drop"></span></button><button id="pause" hidden data-i18n="pause"></button><div class="reading"><span data-i18n="outcomeLabel"></span><output id="water-reading">—</output></div><p id="water-note" class="small"></p></article>
</div><p class="small scene-note" data-i18n="sceneNote"></p>
<div class="calculator"><div><h3 data-i18n="calcTitle"></h3><p data-i18n-rich="calcHelp"></p></div><div><label for="density-input" data-i18n="densityInput"></label><div class="inline"><input id="density-input" type="number" min="0" step="0.01" inputmode="decimal"><button id="calculate" data-i18n="calculate"></button></div><p id="calculation-feedback" role="status"></p></div></div><p class="small" data-i18n="precisionNote"></p>
<div id="mystery-panel" class="mystery-panel" hidden><label for="guess" data-i18n="guessLabel"></label><div class="inline"><select id="guess"></select><button id="check-mystery" data-i18n="checkMystery"></button></div><p id="mystery-feedback" role="status"></p></div>
<div class="record-bar"><button id="record" class="primary" data-i18n="record" disabled></button><p id="record-status" role="status" data-i18n="needMeasurements"></p></div><div class="utility"><span><span data-i18n="seed"></span>: <code id="seed"></code></span><button id="share" data-i18n="share"></button><span id="share-status" role="status"></span></div><p class="small" data-i18n="shareNote"></p><p class="small" data-i18n="newTrialNote"></p>
</section>
<section class="panel"><div class="section-top"><h2 data-i18n="history"></h2><div class="inline"><button id="download" data-i18n="download" disabled></button><button id="clear" data-i18n="clear"></button></div></div><p id="notebook-empty" data-i18n="empty"></p><div class="table-wrap" tabindex="0" data-i18n-attr="aria-label:history"><table id="history"></table></div></section>
<section class="panel"><div class="section-top"><h2 data-i18n="graphTitle"></h2><button id="enlarge-graph" data-i18n="enlargeGraph"></button></div><p data-i18n-rich="graphContext"></p><div id="graph-slot"><div id="graph-workspace"><label for="graph-view" data-i18n="graphView"></label><select id="graph-view"><option value="all" data-i18n="compareTrials"></option><option value="material" data-i18n="currentMaterial"></option></select><fieldset><legend data-i18n="visibleTrials"></legend><div id="graph-trials"></div></fieldset><div class="graph-scroll" tabindex="0" data-i18n-attr="aria-label:graphAlt"><svg id="graph" viewBox="0 0 800 360" role="group" data-i18n-attr="aria-label:graphAlt"></svg></div><p class="small" data-i18n="axisNote"></p><label for="inspect" data-i18n="inspect"></label><select id="inspect"></select><p id="point-readout" class="note" role="status"></p><details><summary data-i18n="graphTable"></summary><div class="table-wrap" tabindex="0" data-i18n-attr="aria-label:graphTable"><table id="graph-table"></table></div></details></div></div></section>
<dialog id="graph-dialog" aria-labelledby="graph-dialog-title"><div class="section-top"><h2 id="graph-dialog-title" data-i18n="graphTitle"></h2><div class="inline"><button id="graph-language" data-i18n="graphLanguage"></button><button id="close-graph" data-i18n="closeGraph"></button></div></div><div id="graph-dialog-body"></div></dialog>
<section class="panel reference"><h2 data-i18n="reference"></h2><p data-i18n-rich="referenceHelp"></p><div id="reference-table"></div></section>
<section class="panel"><p class="eyebrow" data-i18n="step3"></p><h2 data-i18n="explain"></h2><p data-i18n-rich="explainHelp"></p><label for="explanation" data-i18n="explanation"></label><textarea id="explanation" rows="5"></textarea><details class="extension"><summary data-i18n="extension"></summary><p data-i18n="extensionHelp"></p></details></section>
<section class="panel"><p class="eyebrow" data-i18n="step4"></p><h2 data-i18n="checksHeading"></h2><div id="lk-checks"></div></section>
<details class="panel"><summary data-i18n="notes"></summary><p data-i18n="limitations"></p><p data-i18n="standardsNote"></p><p class="sources"><a href="https://www.acs.org/middleschoolchemistry/lessonplans/chapter3/lesson1.html" target="_blank" rel="noopener" data-i18n="sourceACS"></a><a href="https://tea.texas.gov/laws-and-rules/texas-administrative-code/19-tac-chapter-112" target="_blank" rel="noopener" data-i18n="sourceTEKS"></a><a href="https://www.nextgenscience.org/pe/ms-ps1-2-matter-and-its-interactions" target="_blank" rel="noopener" data-i18n="sourceNGSS"></a></p><p class="small" data-i18n="reviewSpanish"></p></details><footer data-i18n="footer"></footer></main><script type="module" src="app.js"></script></body></html>
