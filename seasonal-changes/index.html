<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Investigate how axial tilt, latitude, daylight and sunlight shape seasonal changes in this free grades 6–8 science lab."><title>Seasonal Changes | Sciesmic Labs</title><link rel="stylesheet" href="../kit/labs-kit.css"><link rel="stylesheet" href="styles.css"></head><body><main>
<header class="hero"><div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="h1"></h1><p class="lede" data-i18n="lede"></p><p class="fine" data-i18n="gradeNote"></p><a id="flashcards-link" class="card-link" href="flashcards.html" target="_blank" rel="noopener" data-i18n="openFlashcards"></a></div><div class="hero-figure" aria-hidden="true"><div class="sun-disc"></div><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="planet"><div class="meridian"></div><div class="latitude-line"></div><div class="axis"></div></div><span class="hero-caption">23.5°</span></div></header>
<section class="panel predict"><div><p class="eyebrow" data-i18n="step1"></p><h2 data-i18n="question"></h2></div><label><span data-i18n="predictionLabel"></span><select id="prediction"><option value="" data-i18n="pred0"></option><option value="constant" data-i18n="pred1"></option><option value="winter" data-i18n="pred2"></option><option value="extreme" data-i18n="pred3"></option></select></label></section>
<section class="panel studio"><p class="eyebrow" data-i18n="step2"></p><div class="studio-heading"><h2 data-i18n="workspace"></h2><div class="modes" role="group" data-i18n-attr="aria-label:modeLabel"><button data-mode="explore" data-i18n="explore"></button><button data-mode="compare" data-i18n="compare"></button><button data-mode="claim" data-i18n="claim"></button></div></div><p id="mode-hint" class="mode-hint"></p><p id="challenge-note" class="challenge" hidden></p>
<div class="investigation"><div class="scene"><div id="orbit"></div><p class="scene-note" data-i18n="axisFixed"></p><p class="fine" data-i18n="notScale"></p></div><div class="controls"><label for="latitude" data-i18n="latitude"></label><div class="range-row"><input id="latitude" type="range" min="-80" max="80" value="40" step="1" aria-describedby="lat-help"><output id="latitude-value" for="latitude"></output></div><p id="lat-help" class="fine" data-i18n-rich="latHelp"></p><div id="compare-control" hidden><label for="latitude-b" data-i18n="latitudeB"></label><div class="range-row"><input id="latitude-b" type="range" min="-80" max="80" value="-40" step="1"><output id="latitude-b-value" for="latitude-b"></output></div></div><label for="tilt" data-i18n="tilt"></label><div class="range-row"><input id="tilt" type="range" min="0" max="35" value="23.5" step="0.5" aria-describedby="tilt-help"><output id="tilt-value" for="tilt"></output></div><p id="tilt-help" class="fine" data-i18n-rich="tiltHelp"></p><label for="surface" data-i18n="surface"></label><select id="surface" aria-describedby="surface-help"><option value="land" data-i18n="land"></option><option value="ocean" data-i18n="ocean"></option></select><p id="surface-help" class="fine" data-i18n-rich="surfaceHelp"></p></div></div>
<div class="timeline"><div class="date-heading"><label for="date" data-i18n="date"></label><output id="date-value" for="date"></output></div><input id="date" type="range" min="0" max="365" value="91.25" step="0.25" aria-describedby="date-help"><div class="events"><button data-day="0" data-i18n="mar"></button><button data-day="91.25" data-i18n="jun"></button><button data-day="182.5" data-i18n="sep"></button><button data-day="273.75" data-i18n="dec"></button></div><p id="date-help" class="fine" data-i18n="dateHelp"></p><div class="actions"><button id="play" class="primary" data-i18n="play"></button><button id="reset" data-i18n="reset"></button><button id="new-trial" data-i18n="newTrial"></button><button id="copy-link" data-i18n="copy"></button></div><p class="fine"><span data-i18n="seed"></span>: <code id="seed-value"></code> · <span id="play-status" role="status"></span></p><p id="utility-status" class="fine" role="status"></p></div>
<div class="evidence"><p class="eyebrow" data-i18n="evidence"></p><div id="readings"></div><p class="fine" data-i18n="angleNote"></p><p class="fine" data-i18n-rich="solarNote"></p><p class="fine" data-i18n-rich="tempNote"></p><button id="record" class="primary" data-i18n="record"></button><p id="record-status" role="status"></p></div></section>
<section class="panel graph-panel"><div class="studio-heading"><h2 data-i18n="chartTitle"></h2><label class="metric-label"><span data-i18n="metric"></span><select id="metric"><option value="daylight" data-i18n="daylight"></option><option value="energy" data-i18n="energy"></option><option value="temperature" data-i18n="temperature"></option></select></label></div><p id="graph-description" class="fine" data-i18n="chartDesc"></p><div id="graph" aria-describedby="graph-description"></div><details open><summary data-i18n="annualTable"></summary><div class="table-wrap" tabindex="0" data-i18n-attr="aria-label:annualTable"><table id="annual-table"></table></div></details></section>
<section class="panel"><div class="studio-heading"><h2 data-i18n="history"></h2><button id="download" data-i18n="download"></button></div><p id="empty" class="fine" data-i18n="empty"></p><div class="table-wrap" tabindex="0" data-i18n-attr="aria-label:history"><table id="history-table"></table></div><p class="fine" data-i18n="saved"></p></section>
<section class="panel"><p class="eyebrow" data-i18n="step3"></p><h2 data-i18n="explainPrompt"></h2><p data-i18n-rich="explainHelp"></p><label for="explanation" class="sr-only" data-i18n="explanationLabel"></label><textarea id="explanation" rows="5"></textarea><p data-i18n-rich="termNote"></p></section><section class="panel checks"><p class="eyebrow" data-i18n="step4"></p><h2 data-i18n="checksHeading"></h2><div id="lk-checks"></div></section><details class="panel"><summary data-i18n="modelNotesBtn"></summary><p data-i18n="modelNotes"></p><p><a href="https://science.nasa.gov/earth/earth-observatory/climate-and-earths-energy-budget/">NASA · Earth’s energy budget</a> · <a href="https://spaceplace.nasa.gov/seasons/en/">NASA · Seasons</a></p></details><footer data-i18n="footer"></footer></main><script type="module" src="app.js"></script></body></html>
