<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explore acids, bases, dilution and neutralization in a free bilingual pH lab."><title>Acids & Bases · Sciesmic Labs</title><link rel="stylesheet" href="../kit/labs-kit.css"><link rel="stylesheet" href="styles.css"><link rel="icon" href="data:,"></head>
<body><main class="app-shell">
<header class="masthead"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="h1"></h1><p class="lede" data-i18n-rich="lede"></p><a id="flashcards-link" class="lk-flashcards-link" href="flashcards.html?lang=en" target="_blank" rel="noopener" data-i18n="vocabularyCards"></a><details><summary data-i18n="modelNotesBtn"></summary><p data-i18n="modelNotes"></p><p data-i18n="alignment"></p><p data-i18n="review"></p></details></header>
<section class="panel prediction"><div><p class="eyebrow" data-i18n="step1"></p><h2 data-i18n="predictPrompt"></h2><p class="hint" data-i18n="predictHelp"></p></div><label><span data-i18n="prediction"></span><textarea id="prediction" rows="2"></textarea></label></section>
<p class="eyebrow step" data-i18n="step2"></p>
<div class="mode-tabs" role="group" data-i18n-attr="aria-label:controls"><button data-mode="test" aria-pressed="true" data-i18n="test"></button><button data-mode="dilute" aria-pressed="false" data-i18n="dilute"></button><button data-mode="neutralize" aria-pressed="false" data-i18n="neutralize"></button></div>
<div class="workspace"><section class="panel bench-panel" aria-labelledby="bench-title"><div class="panel-heading"><h2 id="bench-title" data-i18n="bench"></h2><span id="trial-badge" class="badge"></span></div>
<div class="scene" aria-hidden="true"><svg id="scene-svg" viewBox="0 0 640 400"></svg><span id="scene-reading"></span></div>
<div class="reading-row" aria-live="polite"><div><span data-i18n="phLabel"></span><strong id="reading">—</strong></div><div><span id="classification"></span><strong id="volume"></strong></div></div><p id="measurement-status" class="hint"></p>
<div class="scale" aria-hidden="true"><img src="assets/ph_scale_bar.svg" alt=""><img id="scale-marker" hidden src="assets/ph_scale_marker.svg" alt=""></div><div class="scale-labels"><span data-i18n="moreAcid"></span><span data-i18n="neutral"></span><span data-i18n="moreBase"></span></div><p class="hint" data-i18n-rich="phHint"></p></section>
<section class="panel controls" aria-labelledby="controls-title"><h2 id="controls-title" data-i18n="controls"></h2><p id="mode-hint" class="hint"></p>
<div id="test-controls"><label><span data-i18n="sample"></span><select id="sample"></select></label></div>
<div id="dilute-controls" hidden><label><span data-i18n="solution"></span><select id="solution"><option value="acid" data-i18n="acid"></option><option value="base" data-i18n="base"></option><option value="neutral" data-i18n="neutralSolution"></option></select></label><label for="water"><span data-i18n="waterVolume"></span><output id="water-output" for="water">0</output></label><input id="water" type="range" min="0" max="180" step="1" value="0"><button id="add-water" class="secondary" data-i18n="addWater"></button></div>
<div id="neutralize-controls" hidden><label for="base"><span data-i18n="baseVolume"></span><output id="base-output" for="base">0</output></label><input id="base" type="range" min="0" max="120" step="0.1" value="0"><div class="button-row"><button id="add-base" class="secondary" data-i18n="addBase"></button><button id="fine-base" class="secondary" data-i18n="fineBase"></button></div><button id="auto" class="secondary" data-i18n="run"></button></div>
<label><span data-i18n="tool"></span><select id="tool"><option value="probe" data-i18n="probe"></option><option value="strip" data-i18n="strip"></option><option value="indicator" data-i18n="indicator"></option></select></label><button id="measure" class="primary" data-i18n="read"></button><p class="hint" data-i18n="readingHint"></p>
<label><span data-i18n="note"></span><textarea id="note" rows="2" data-i18n-attr="placeholder:noteHint"></textarea></label><button id="record" class="secondary" data-i18n="record" disabled></button><div class="button-row utility"><button id="reset" data-i18n="reset"></button><button id="new-trial" data-i18n="newTrial"></button></div><p class="hint" data-i18n="compareHelp"></p><p class="hint"><span data-i18n="seedLabel"></span>: <code id="seed"></code> · <button id="share" class="text-button" data-i18n="share"></button></p><p class="hint" data-i18n="replayHint"></p><p id="status" role="status"></p></section></div>
<section class="panel particle-panel"><div><p class="eyebrow" data-i18n="ions"></p><p data-i18n-rich="ionNote"></p><p class="hint" data-i18n-rich="concentration"></p><dl class="concentrations"><div><dt>H₃O⁺</dt><dd id="h-value"></dd></div><div><dt>OH⁻</dt><dd id="oh-value"></dd></div></dl><p class="hint" data-i18n="ionLegend"></p><p id="spectators" data-i18n="spectators" hidden></p></div><svg id="particles" viewBox="0 0 240 240" aria-hidden="true"></svg></section>
<section class="panel chart-panel"><div class="panel-heading"><h2 data-i18n="graph"></h2><button id="expand" class="secondary" data-i18n="enlarge"></button></div><label><span data-i18n="compare"></span><select id="compare"><option value="all" data-i18n="allTrials"></option><option value="current" data-i18n="currentTrial"></option></select></label><p class="hint" data-i18n="graphHelp"></p><div id="chart-host"></div><label><span data-i18n="point"></span><select id="point"></select></label><p id="point-read" role="status"></p></section>
<section class="panel notebook"><div class="panel-heading"><h2 data-i18n="tableTitle"></h2><button id="download" class="secondary" data-i18n="download"></button></div><div class="table-wrap" tabindex="0" data-i18n-attr="aria-label:tableTitle"><table><thead><tr><th data-i18n="thTrial"></th><th data-i18n="thSample"></th><th data-i18n="thAdded"></th><th data-i18n="thVolume"></th><th data-i18n="thTool"></th><th data-i18n="thPH"></th><th data-i18n="thNote"></th></tr></thead><tbody id="records"></tbody></table></div></section>
<section class="panel explain"><p class="eyebrow" data-i18n="step3"></p><p data-i18n="explain"></p><label><span data-i18n="conclusion"></span><textarea id="conclusion" rows="3"></textarea></label></section>
<section class="panel checks"><p class="eyebrow" data-i18n="step4"></p><div id="lk-checks"></div></section><p class="safety" data-i18n="safety"></p><footer data-i18n="footer"></footer>
</main><dialog id="graph-dialog" aria-labelledby="dialog-title"><div class="panel-heading"><h2 id="dialog-title" data-i18n="graph"></h2><button id="close-graph" class="secondary" data-i18n="close"></button></div><p class="hint" data-i18n="graphHelp"></p><div id="large-chart"></div><label><span data-i18n="point"></span><select id="large-point"></select></label><p id="large-point-read" role="status"></p></dialog><script type="module" src="app.js"></script></body></html>
