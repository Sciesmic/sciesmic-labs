<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Investigate predator-prey populations, seasonal camouflage, snow cover and resources in a free bilingual Sciesmic science simulation."><title>Predator Prey Lab | Sciesmic Labs</title><link rel="stylesheet" href="../kit/labs-kit.css"><link rel="stylesheet" href="styles.css"></head><body><main>
<header class="hero"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="h1"></h1><div class="intro"><p data-i18n-rich="lede"></p><div><p class="grade" data-i18n="grade"></p><a id="flashcards-link" href="flashcards.html" target="_blank" rel="noopener" data-i18n="openFlashcards"></a></div></div></header>
<section class="predict"><div><p class="eyebrow" data-i18n="step1"></p><h2 data-i18n="question"></h2></div><label><span data-i18n="prediction"></span><textarea id="prediction" rows="2"></textarea></label></section>
<section class="review-banner"><p data-i18n="reviewNote"></p><div class="buttons"><button type="button" data-preset="baseline" data-i18n="baselinePreset"></button><button type="button" data-preset="seasonal" data-i18n="seasonalPreset"></button><button type="button" data-preset="user" data-i18n="userPreset"></button></div></section><section class="workspace"><div class="heading"><div><p class="eyebrow" data-i18n="step2"></p><h2 data-i18n="workspace"></h2></div><label class="mode"><span data-i18n="experiment"></span><select id="experiment"><option value="short" data-i18n="short"></option><option value="population" data-i18n="population"></option></select></label><label class="mode"><span data-i18n="mode"></span><select id="mode"><option value="guided" data-i18n="guided"></option><option value="explore" data-i18n="explore"></option><option value="mystery" data-i18n="mystery"></option></select></label></div><p id="mode-hint" class="mode-hint"></p>
<div class="experiment"><aside class="controls"><label id="years-control"><span data-i18n="years"></span><select id="years"><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="30">30</option></select></label><label id="climate-control"><span data-i18n="climate"></span><select id="climate"><option value="seasonal" data-i18n="climateSeasonal"></option><option value="constant" data-i18n="climateConstant"></option></select></label><div class="season-row"><label><span id="season-label" data-i18n="season"></span><select id="season"><option value="spring" data-i18n="spring"></option><option value="summer" data-i18n="summer"></option><option value="fall" data-i18n="fall"></option><option value="winter" data-i18n="winter"></option></select></label><label><span data-i18n="coat"></span><select id="coat"><option value="seasonal" data-i18n="seasonal"></option><option value="brown" data-i18n="brown"></option><option value="white" data-i18n="white"></option></select></label></div>
<label><span id="snow-label" data-i18n="snow"></span><output for="snow" id="snow-value"></output><input id="snow" type="range" min="0" max="100" step="10" value="100"></label><div class="population-inputs"><label><span data-i18n="hares"></span><input id="hares" type="number" min="0" max="300" value="80"></label><label><span data-i18n="foxes"></span><input id="foxes" type="number" min="0" max="30" value="6"></label></div>
<label><span data-i18n="food"></span><output for="food" id="food-value"></output><input id="food" type="range" min="0" max="300" step="10" value="180"></label><details class="advanced"><summary data-i18n="advanced"></summary><label><span data-i18n="shelter"></span><output for="shelter" id="shelter-value"></output><input id="shelter" type="range" min="0" max="100" step="5" value="25"></label></details><p class="small" data-i18n-rich="camouflageNote"></p></aside>
<div class="field"><div class="field-top"><span id="scene-status"></span><span><span data-i18n="week"></span> <b id="week-value">0</b> / <span id="end-week">52</span></span></div><svg id="meadow" viewBox="0 0 900 440" role="img" aria-labelledby="meadow-title meadow-desc"></svg><div class="field-bottom"><span class="animal-label hare-label"><img class="count-icon" src="assets/art/icon_hare.png" alt="" aria-hidden="true"><span data-i18n="hares"></span> <strong id="h-count"></strong></span><span class="animal-label fox-label"><img class="count-icon" src="assets/art/icon_fox.png" alt="" aria-hidden="true"><span data-i18n="foxes"></span> <strong id="f-count"></strong></span><span id="probability"></span></div><p class="small scene-note" data-i18n="sceneNote"></p></div></div>
<div class="playback"><button id="play" class="primary" data-i18n="play"></button><button id="step" data-i18n="step"></button><button id="one-year" data-i18n="oneYear"></button><button id="finish" data-i18n="finish"></button><button id="reset" data-i18n="reset"></button><button id="new" data-i18n="new"></button></div><div class="seed-row"><label><span data-i18n="seed"></span><input id="seed" type="number" min="0" max="4294967295" value="42"></label><button id="share" data-i18n="share"></button><p id="status" role="status"></p></div><p class="small" data-i18n="coatNote"></p><p class="small" data-i18n="densityNote"></p>
<div id="mystery-box" hidden><label><span data-i18n="diagnosis"></span><select id="diagnosis"><option value="brown" data-i18n="brown"></option><option value="white" data-i18n="white"></option></select></label><button id="diagnose" data-i18n="checkDiagnosis"></button><p id="diagnosis-result" role="status"></p></div></section>
<section class="evidence"><div class="chart-panel"><div class="heading"><h2 data-i18n="counts"></h2><span class="legend"><i></i><span data-i18n="hares"></span><i></i><span data-i18n="foxes"></span><i class="capacity-key" hidden></i><span id="capacity-key-label" data-i18n="capacityLegend" hidden></span></span></div><div class="graph-controls"><label><span data-i18n="graphView"></span><select id="graph-view"><option value="percent" data-i18n="percentView"></option><option value="abundance" data-i18n="abundanceView"></option></select></label><label class="capacity-toggle"><input type="checkbox" id="show-capacity"><span data-i18n="showCapacity"></span></label></div><p id="capacity-note" class="small"></p><svg id="graph" viewBox="0 0 800 440" role="img" aria-labelledby="graph-title graph-desc"></svg><p class="small" data-i18n="dataNote"></p></div><div class="hunt-panel"><p class="eyebrow" data-i18n="hunting"></p><div id="hunt-stats"></div><p class="small" data-i18n="cumulative"></p><h3 data-i18n="interval"></h3><div id="population-flux"></div><p id="feedback" class="small"></p></div></section>
<section class="records"><div class="heading"><h2 data-i18n="history"></h2><div class="buttons"><button id="save" class="primary" data-i18n="save"></button><button id="download" data-i18n="download"></button></div></div><p id="empty" class="small" data-i18n="empty"></p><div class="table-wrap" tabindex="0" data-i18n-attr="aria-label:history"><table id="history"></table></div><details id="annual-details"><summary data-i18n="annual"></summary><div class="table-wrap" tabindex="0" data-i18n-attr="aria-label:annual"><table id="annual"></table></div></details><details id="weekly-details"><summary data-i18n="data"></summary><div class="table-wrap" tabindex="0" data-i18n-attr="aria-label:data"><table id="weekly"></table></div></details></section>
<section class="explain"><p class="eyebrow" data-i18n="step3"></p><h2 data-i18n="explainPrompt"></h2><p data-i18n-rich="explainNote"></p><label><span data-i18n="explanation"></span><textarea id="explanation" rows="4"></textarea></label></section><section class="checks"><p class="eyebrow" data-i18n="step4"></p><h2 data-i18n="checksHeading"></h2><div id="lk-checks"></div></section><details class="notes"><summary data-i18n="notes"></summary><p data-i18n="modelNotes"></p><p><a href="https://www.nps.gov/articles/snowshoe-hare.htm">NPS · Snowshoe hare ecology</a> / <a href="https://www.usgs.gov/news/identifying-effects-climate-and-land-use-change-snowshoe-hare-midwest">USGS · Camouflage mismatch</a></p></details><footer data-i18n="footer"></footer></main><script type="module" src="app.js"></script></body></html>
